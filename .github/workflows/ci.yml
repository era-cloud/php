name: Build and Push PHP Docker Images

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      variants:
        description: '只构建匹配的变体（逗号分隔、子串匹配，可为空=全部）。例: 8.5-bookworm-swoole, swoole, alpine3.24'
        required: false
        default: ''
  # pull_request:
  # push:
  # schedule:
  #   - cron: '0 0 * * *'
defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  packages: write
  security-events: write
jobs:
  apply-templates:
    name: Check For Uncomitted Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply Templates
        run: ./apply-templates.sh
      - name: Update the Docker image Version
        run:  ./update.sh
      # - name: Check Git Status
      #   run: git diff --exit-code
  generate-jobs:
    needs: apply-templates
    name: Generate Jobs
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.generate-jobs.outputs.strategy }}
      strategy_base: ${{ steps.generate-jobs.outputs.strategy_base }}
      strategy_ext: ${{ steps.generate-jobs.outputs.strategy_ext }}
      count_base: ${{ steps.generate-jobs.outputs.count_base }}
      count_ext: ${{ steps.generate-jobs.outputs.count_ext }}
    steps:
      - uses: actions/checkout@v7
      - name: Clone bashbrew
        run: git clone --depth 1 https://github.com/docker-library/bashbrew "$RUNNER_TEMP/bashbrew"
      - uses: actions/setup-go@v7
        with:
          go-version-file: "${{ runner.temp }}/bashbrew/go.mod"
          cache: false
      - name: Set up bashbrew
        run: |
          cd "$RUNNER_TEMP/bashbrew"
          ./bashbrew.sh --version
          echo "$RUNNER_TEMP/bashbrew/bin" >> "$GITHUB_PATH"
          echo "BASHBREW_SCRIPTS=$RUNNER_TEMP/bashbrew/scripts" >> "$GITHUB_ENV"
      - id: generate-jobs
        name: Generate Jobs
        env:
          VARIANTS: ${{ inputs.variants || '' }}
        run: |
          strategy="$("./.github/scripts/generate.sh")"

          # 分层：base（cli/zts，编译 PHP）必须全部构建完并同步别名后，才开始扩展层
          # matrix 为空时 GitHub 会直接报错，所以空集合塞一个占位节点 + 用 job 级 if 跳过
          dummy='{"fail-fast":false,"matrix":{"include":[{"name":"(none)","os":"ubuntu-latest","phase":"none","meta":{"entries":[],"dockerfiles":[],"froms":[]},"runs":{}}]}}'
          subset() {
            jq -c --arg p "$1" --argjson dummy "$dummy" '
              .matrix.include |= [ .[] | select(.phase == $p) ]
              | if (.matrix.include | length) == 0 then $dummy else . end
            ' <<<"$strategy"
          }
          count_of() {
            jq -r --arg p "$1" '[ .matrix.include[] | select(.phase == $p) ] | length' <<<"$strategy"
          }
          for key in strategy strategy_base strategy_ext; do
            case "$key" in
              strategy) json="$strategy" ;;
              strategy_base) json="$(subset base)" ;;
              strategy_ext) json="$(subset ext)" ;;
            esac
            EOF="EOF-$RANDOM-$RANDOM-$RANDOM"
            echo "$key<<$EOF" >> "$GITHUB_OUTPUT"
            jq <<<"$json" . | tee -a "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          done
          {
            echo "count_base=$(count_of base)"
            echo "count_ext=$(count_of ext)"
          } >> "$GITHUB_OUTPUT"

  build-base:
    needs: generate-jobs
    if: needs.generate-jobs.outputs.count_base != '0'
    strategy: ${{ fromJson(needs.generate-jobs.outputs.strategy_base) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check variant changed
        id: changed
        run: ./.github/scripts/variant-changed.sh "$(dirname '${{ matrix.meta.dockerfiles[0] }}')" '${{ matrix.name }}'
      # - name: Login to the Docker registry
      #   run: docker login --username ${{ vars.DH_USERNAME  }} --password ${{ secrets.DH_TOKEN }}
      - name: Login to the Github Container registry
        run: docker login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
      - name: Set up buildx (docker-container)
        if: steps.changed.outputs.changed == 'true'
        run: |
          # docker-container driver is required for zstd layer compression
          docker buildx create --driver docker-container --name ci-builder --use --bootstrap
      - name: Prepare Environment
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.prepare }}
      - name: Pull Dependencies
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.pull }}
      - name: Build ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.build }}
      - name: Sync ghcr alias tags ${{ matrix.name }}
        # 分层后扩展层 FROM 自家 base 的短别名，base 的别名必须在本 job 内立即同步，
        # 否则 build-ext 阶段拉不到 base（mirror job 太晚了）
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.syncAliases }}
      - name: History ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.history }}
      - name: Test ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.test }}
      - name: '"Docker images"'
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.images }}
      - name: Record image metrics
        if: steps.changed.outputs.changed == 'true'
        run: |
          size="$(docker image inspect --format '{{.Size}}' ghcr.io/era-cloud/php:${{ matrix.name }})"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg t "${{ matrix.name }}" --argjson s "$size" --arg b "$built_at" \
            '{tag:$t,size:$s,built_at:$b}' > size-${{ matrix.name }}.json
      - name: Trivy security scan
        id: scan
        if: steps.changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/era-cloud/php:${{ matrix.name }}
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          ignore-policy: rego-policy.rego
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - name: Fix Trivy SARIF levels
        if: steps.scan.outcome == 'success'
        run: |
          # trivy 0.73.0 emits HIGH findings at level "error" when a multi-value
          # --severity filter is applied; restore HIGH -> "warning" so code
          # scanning shows the correct severity
          jq '(.runs[].results[]? | select((.message.text // "") | contains("Severity: HIGH"))) |= (.level = "warning")' \
            trivy-${{ matrix.name }}.sarif > trivy-${{ matrix.name }}.fixed.sarif
          mv trivy-${{ matrix.name }}.fixed.sarif trivy-${{ matrix.name }}.sarif
      - name: Upload Trivy SARIF
        if: ${{ steps.scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
      - name: Upload metrics artifact
        if: ${{ always() && steps.changed.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics-${{ matrix.name }}
          path: |
            size-*.json
            trivy-*.sarif
          if-no-files-found: ignore
      - name: Record pull size
        if: steps.changed.outputs.changed == 'true'
        run: |
          # compressed (zstd) layer size of the pushed ghcr image = what a pull downloads.
          # docker manifest inspect uses the docker-login credentials (GITHUB_TOKEN as a
          # raw bearer is rejected by ghcr's /v2 API with 403).
          mf="$(docker manifest inspect ghcr.io/era-cloud/php:${{ matrix.name }})"
          if ! jq -e '.layers' <<<"$mf" >/dev/null 2>&1; then
            digest="$(jq -r '.manifests[]? | select((.platform.os // "") == "linux" and (.platform.architecture // "") == "amd64") | .digest' <<<"$mf" | head -1)"
            mf="$(docker manifest inspect ghcr.io/era-cloud/php:${{ matrix.name }}@$digest)"
          fi
          pull_size="$(jq '[.layers[]?.size] | add' <<<"$mf")"
          jq -n --arg t "${{ matrix.name }}" --argjson p "$pull_size" '{tag:$t, pull_size:$p}' > pull-size-${{ matrix.name }}.json
          echo "pull_size=$pull_size"
      - name: Upload pull size artifact
        if: ${{ always() && steps.changed.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pullsize-${{ matrix.name }}
          path: pull-size-${{ matrix.name }}.json
          if-no-files-found: ignore
  build-ext:
    needs: [generate-jobs, build-base]
    if: needs.generate-jobs.outputs.count_ext != '0'
    strategy: ${{ fromJson(needs.generate-jobs.outputs.strategy_ext) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check variant changed
        id: changed
        run: ./.github/scripts/variant-changed.sh "$(dirname '${{ matrix.meta.dockerfiles[0] }}')" '${{ matrix.name }}'
      # - name: Login to the Docker registry
      #   run: docker login --username ${{ vars.DH_USERNAME  }} --password ${{ secrets.DH_TOKEN }}
      - name: Login to the Github Container registry
        run: docker login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
      - name: Set up buildx (docker-container)
        if: steps.changed.outputs.changed == 'true'
        run: |
          # docker-container driver is required for zstd layer compression
          docker buildx create --driver docker-container --name ci-builder --use --bootstrap
      - name: Prepare Environment
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.prepare }}
      - name: Pull Dependencies
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.pull }}
      - name: Build ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.build }}
      - name: Sync ghcr alias tags ${{ matrix.name }}
        # 分层后扩展层 FROM 自家 base 的短别名，base 的别名必须在本 job 内立即同步，
        # 否则 build-ext 阶段拉不到 base（mirror job 太晚了）
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.syncAliases }}
      - name: History ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.history }}
      - name: Test ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.test }}
      - name: '"Docker images"'
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.images }}
      - name: Record image metrics
        if: steps.changed.outputs.changed == 'true'
        run: |
          size="$(docker image inspect --format '{{.Size}}' ghcr.io/era-cloud/php:${{ matrix.name }})"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg t "${{ matrix.name }}" --argjson s "$size" --arg b "$built_at" \
            '{tag:$t,size:$s,built_at:$b}' > size-${{ matrix.name }}.json
      - name: Trivy security scan
        id: scan
        if: steps.changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/era-cloud/php:${{ matrix.name }}
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          ignore-policy: rego-policy.rego
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - name: Fix Trivy SARIF levels
        if: steps.scan.outcome == 'success'
        run: |
          # trivy 0.73.0 emits HIGH findings at level "error" when a multi-value
          # --severity filter is applied; restore HIGH -> "warning" so code
          # scanning shows the correct severity
          jq '(.runs[].results[]? | select((.message.text // "") | contains("Severity: HIGH"))) |= (.level = "warning")' \
            trivy-${{ matrix.name }}.sarif > trivy-${{ matrix.name }}.fixed.sarif
          mv trivy-${{ matrix.name }}.fixed.sarif trivy-${{ matrix.name }}.sarif
      - name: Upload Trivy SARIF
        if: ${{ steps.scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
      - name: Upload metrics artifact
        if: ${{ always() && steps.changed.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics-${{ matrix.name }}
          path: |
            size-*.json
            trivy-*.sarif
          if-no-files-found: ignore
      - name: Record pull size
        if: steps.changed.outputs.changed == 'true'
        run: |
          # compressed (zstd) layer size of the pushed ghcr image = what a pull downloads.
          # docker manifest inspect uses the docker-login credentials (GITHUB_TOKEN as a
          # raw bearer is rejected by ghcr's /v2 API with 403).
          mf="$(docker manifest inspect ghcr.io/era-cloud/php:${{ matrix.name }})"
          if ! jq -e '.layers' <<<"$mf" >/dev/null 2>&1; then
            digest="$(jq -r '.manifests[]? | select((.platform.os // "") == "linux" and (.platform.architecture // "") == "amd64") | .digest' <<<"$mf" | head -1)"
            mf="$(docker manifest inspect ghcr.io/era-cloud/php:${{ matrix.name }}@$digest)"
          fi
          pull_size="$(jq '[.layers[]?.size] | add' <<<"$mf")"
          jq -n --arg t "${{ matrix.name }}" --argjson p "$pull_size" '{tag:$t, pull_size:$p}' > pull-size-${{ matrix.name }}.json
          echo "pull_size=$pull_size"
      - name: Upload pull size artifact
        if: ${{ always() && steps.changed.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pullsize-${{ matrix.name }}
          path: pull-size-${{ matrix.name }}.json
          if-no-files-found: ignore
  mirror:
    name: mirror ${{ matrix.name }}
    needs: [build-base, build-ext, generate-jobs]
    if: ${{ !cancelled() }}
    continue-on-error: true
    strategy: ${{ fromJson(needs.generate-jobs.outputs.strategy) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check variant changed
        id: changed
        run: ./.github/scripts/variant-changed.sh "$(dirname '${{ matrix.meta.dockerfiles[0] }}')" '${{ matrix.name }}'
      - name: Login to the Github Container registry
        run: docker login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
      - name: Login to the Aliyun ACR registry
        if: steps.changed.outputs.changed == 'true'
        run: |
          for i in 1 2 3; do
            if docker login --username '${{ vars.ACR_USERNAME }}' --password '${{ secrets.ACR_TOKEN }}' '${{ vars.ACR_REGISTRY }}'; then
              exit 0
            fi
            echo "::warning title=ACR login retry::$i/3 失败，5s 后重试"
            sleep 5
          done
          echo "::error title=ACR login failed::连续 3 次登录失败"
          exit 1
      - name: Install skopeo
        if: steps.changed.outputs.changed == 'true'
        run: |
          if command -v skopeo > /dev/null; then skopeo --version; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version
      - name: Sync ghcr alias tags ${{ matrix.name }}
        run: ${{ matrix.runs.syncAliases }}
      - name: Mirror to Aliyun ACR ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.push }}
      - name: Notify Feishu on mirror failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          NAME: ${{ matrix.name }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning title=FEISHU_WEBHOOK 未配置::跳过飞书推送"
            exit 0
          fi
          text="【era-cloud/php】ACR 镜像同步失败：${NAME}（构建与 ghcr 已成功，mirror 将在下一轮重试）"
          payload="$(jq -n --arg t "$text" '{msg_type: "text", content: {text: $t}}')"
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" > /dev/null
          echo "feishu 已推送"

  changes:
    needs: [build-base, build-ext]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check Git Status
      run: git diff --exit-code
    - name: Push changes
      run: |
        if git diff --exit-code; then
          echo "No changes to commit"
        else
          git merge
          git config --global user.name 'GitHub Actions'
          git config user.email github-actions@github.com
          git add .
          git commit -am "ci: Update Docker image version"
          git config pull.rebase false
          git pull
          git merge
          git push
        fi
    - name: Remove Untagged Release
      run: ./untagged.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  aggregate-metrics:
    needs: [build-base, build-ext, changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: metrics-artifacts
        digest-mismatch: warn
    - name: Merge metrics
      run: ./.github/scripts/merge-metrics.sh
    - name: Update README matrix
      run: ./.github/scripts/update-readme.sh
    - name: Commit and push metrics
      run: |
        if git diff --exit-code; then
          echo "No changes to commit"
        else
          git config --global user.name 'GitHub Actions'
          git config --global user.email github-actions@github.com
          git add .image-metrics.json .build-state.json README.md .scan-results.json
          git commit -m "ci: update image metrics (size/build time/security scan) + build state"
          git config pull.rebase false
          git pull
          git merge
          git push
        fi
