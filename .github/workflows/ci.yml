name: Build and Push PHP Docker Images

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      variants:
        description: '只构建匹配的变体（逗号分隔、子串匹配，可为空=全部）。例: 8.5-bookworm-swoole, swoole, alpine3.24'
        required: false
        default: ''
  # pull_request:
  # push:
  # schedule:
  #   - cron: '0 0 * * *'
defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  packages: write
  security-events: write
jobs:
  apply-templates:
    name: Check For Uncomitted Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply Templates
        run: ./apply-templates.sh
      - name: Update the Docker image Version
        run:  ./update.sh
      # - name: Check Git Status
      #   run: git diff --exit-code
  generate-jobs:
    needs: apply-templates
    name: Generate Jobs
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.generate-jobs.outputs.strategy }}
    steps:
      - uses: actions/checkout@v7
      - name: Clone bashbrew
        run: git clone --depth 1 https://github.com/docker-library/bashbrew "$RUNNER_TEMP/bashbrew"
      - uses: actions/setup-go@v7
        with:
          go-version-file: "${{ runner.temp }}/bashbrew/go.mod"
          cache: false
      - name: Set up bashbrew
        run: |
          cd "$RUNNER_TEMP/bashbrew"
          ./bashbrew.sh --version
          echo "$RUNNER_TEMP/bashbrew/bin" >> "$GITHUB_PATH"
          echo "BASHBREW_SCRIPTS=$RUNNER_TEMP/bashbrew/scripts" >> "$GITHUB_ENV"
      - id: generate-jobs
        name: Generate Jobs
        env:
          VARIANTS: ${{ inputs.variants || '' }}
        run: |
          strategy="$("./.github/scripts/generate.sh")"

          EOF="EOF-$RANDOM-$RANDOM-$RANDOM"
          echo "strategy<<$EOF" >> "$GITHUB_OUTPUT"
          jq <<<"$strategy" . | tee -a "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-jobs
    strategy: ${{ fromJson(needs.generate-jobs.outputs.strategy) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check variant changed
        id: changed
        run: |
          last="$(jq -r --arg n "${{ matrix.name }}" '.[$n] // empty' .build-state.json 2>/dev/null || true)"
          variant_dir="$(dirname "${{ matrix.meta.dockerfiles[0] }}")"
          paths="$variant_dir Dockerfile-linux.template versions.json docker-php-entrypoint docker-php-ext-configure docker-php-ext-enable docker-php-ext-install docker-php-source apply-templates.sh"
          changed="true"
          if [ -n "$last" ] && git diff --quiet "$last"..HEAD -- $paths; then
            changed="false"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "last=$last changed=$changed"
      # - name: Login to the Docker registry
      #   run: docker login --username ${{ vars.DH_USERNAME  }} --password ${{ secrets.DH_TOKEN }}
      - name: Login to the Github Container registry
        run: docker login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
      - name: Login to the Aliyun ACR registry
        run: docker login --username ${{ vars.ACR_USERNAME }} --password ${{ secrets.ACR_TOKEN }}  ${{ vars.ACR_REGISTRY }}
      - name: Prepare Environment
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.prepare }}
      - name: Pull Dependencies
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.pull }}
      - name: Build ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.build }}
      - name: History ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.history }}
      - name: Test ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.test }}
      - name: '"Docker images"'
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.images }}
      - name: Record image metrics
        if: steps.changed.outputs.changed == 'true'
        run: |
          size="$(docker image inspect --format '{{.Size}}' ghcr.io/era-cloud/php:${{ matrix.name }})"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg t "${{ matrix.name }}" --argjson s "$size" --arg b "$built_at" \
            '{tag:$t,size:$s,built_at:$b}' > size-${{ matrix.name }}.json
      - name: Trivy security scan
        id: scan
        if: steps.changed.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/era-cloud/php:${{ matrix.name }}
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          ignore-policy: rego-policy.rego
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - name: Fix Trivy SARIF levels
        if: steps.scan.outcome == 'success'
        run: |
          # trivy 0.73.0 emits HIGH findings at level "error" when a multi-value
          # --severity filter is applied; restore HIGH -> "warning" so code
          # scanning shows the correct severity
          jq '(.runs[].results[]? | select((.message.text // "") | contains("Severity: HIGH"))) |= (.level = "warning")' \
            trivy-${{ matrix.name }}.sarif > trivy-${{ matrix.name }}.fixed.sarif
          mv trivy-${{ matrix.name }}.fixed.sarif trivy-${{ matrix.name }}.sarif
      - name: Upload Trivy SARIF
        if: ${{ steps.scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
      - name: Upload metrics artifact
        if: ${{ always() && steps.changed.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics-${{ matrix.name }}
          path: |
            size-*.json
            trivy-*.sarif
          if-no-files-found: ignore
      - name: Push images ${{ matrix.name }}
        if: steps.changed.outputs.changed == 'true'
        run: ${{ matrix.runs.push }}
  changes:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check Git Status
      run: git diff --exit-code
    - name: Push changes
      run: |
        if git diff --exit-code; then
          echo "No changes to commit"
        else
          git merge
          git config --global user.name 'GitHub Actions'
          git config user.email github-actions@github.com
          git add .
          git commit -am "ci: Update Docker image version"
          git config pull.rebase false
          git pull
          git merge
          git push
        fi
    - name: Remove Untagged Release
      run: ./untagged.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  aggregate-metrics:
    needs: [build, changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: metrics-artifacts
        digest-mismatch: warn
    - name: Merge metrics
      run: ./.github/scripts/merge-metrics.sh
    - name: Update README matrix
      run: ./.github/scripts/update-readme.sh
    - name: Commit and push metrics
      run: |
        if git diff --exit-code; then
          echo "No changes to commit"
        else
          git config --global user.name 'GitHub Actions'
          git config --global user.email github-actions@github.com
          git add .image-metrics.json .build-state.json README.md .scan-results.json
          git commit -m "ci: update image metrics (size/build time/security scan) + build state"
          git config pull.rebase false
          git pull
          git merge
          git push
        fi
