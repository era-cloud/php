name: Notify CI Failure

# 任一关键 workflow 失败时推送飞书（并把失败 job 列表带上）。
# 需要仓库 secret：FEISHU_WEBHOOK（未配置时只打 warning，不失败）。

on:
  workflow_run:
    workflows:
      - Release
      - Build and Push PHP Docker Images
      - Security Scan
      - Auto PHP 8.6 GA Switch
      - Check Upstream Sync
      - Check PHP 8.6 Extension Support
      - Docs
    types: [completed]

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu alert
        env:
          WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning title=FEISHU_WEBHOOK 未配置::跳过飞书推送（在仓库 Settings → Secrets 里添加 FEISHU_WEBHOOK）"
            exit 0
          fi

          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | .[0:8] | join("、")')"
          [ -n "$failed" ] || failed='(未取到具体 job)'

          text="$(printf '%s\n' \
            "【era-cloud/php】CI 失败：${WF_NAME}" \
            "分支：${BRANCH}  提交：${SHA:0:8}" \
            "失败 job：${failed}" \
            "日志：${WF_URL}")"

          payload="$(jq -n --arg t "$text" '{msg_type: "text", content: {text: $t}}')"
          code="$(curl -sS -o /tmp/feishu.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK")"
          echo "feishu http=$code resp=$(cat /tmp/feishu.out)"
          [ "$code" = "200" ]
