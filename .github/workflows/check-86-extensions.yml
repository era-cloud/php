name: Check PHP 8.6 Extension Support

# 每周检查 swoole / swow 是否已经能编译到 PHP 8.6。
# 背景：8.6-rc 目前只出 cli / zts，因为这两个扩展没有任何可编译于 8.6 的版本
# （swoole master 的 composer.json 明写 php <8.6）。等这里变绿并开 issue 后，
# 把 versions.sh 里的 IN("8.2", "8.3", "8.4", "8.5") 条件去掉即可恢复 5 个变体。

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:
  check:
    name: Probe swoole / swow against PHP 8.6
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/era-cloud/php:8.6-rc-cli-trixie
    steps:
      - name: Login to ghcr
        run: docker login --username '${{ github.actor }}' --password '${{ secrets.GITHUB_TOKEN }}' ghcr.io
      - name: Pull PHP 8.6 probe image
        run: docker pull "$IMAGE"
      - name: Probe extensions
        id: probe
        run: |
          ready=""
          # 与 Dockerfile-linux.template 里各变体的构建依赖保持一致
          SWOOLE_DEPS='libbrotli-dev libc-ares-dev libcurl4-openssl-dev libpq-dev libsqlite3-dev libssl-dev libzstd-dev'
          SWOW_DEPS='libbz2-dev libffi-dev libicu-dev libpng-dev libpq-dev libtidy-dev libxml2-dev libzip-dev libc-ares-dev libssl-dev libcurl4-openssl-dev'

          probe() { # <name> <package> <deps> <configure options...>
            local name="$1" pkg="$2" deps="$3"; shift 3
            if docker run --rm --entrypoint bash "$IMAGE" -euc "
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends git $deps
                pie install --no-cache --no-build-tools-check --no-system-dependencies-check --skip-enable-extension '$pkg' $*
              " > "/tmp/$name.log" 2>&1; then
              echo "::notice title=$name::$pkg 已可在 PHP 8.6 上编译"
              ready="$ready $name"
            else
              echo "::warning title=$name::$pkg 仍无法在 PHP 8.6 上编译"
              tail -20 "/tmp/$name.log" || true
            fi
          }

          probe swoole swoole/swoole "$SWOOLE_DEPS" \
            --enable-swoole-curl --enable-cares --enable-brotli \
            --enable-swoole-pgsql --enable-swoole-sqlite --with-openssl-dir=/usr
          probe swow swow/swow-extension "$SWOW_DEPS"

          echo "ready=$(echo $ready)" >> "$GITHUB_OUTPUT"
      - name: Open reminder issue
        if: steps.probe.outputs.ready != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ready='${{ steps.probe.outputs.ready }}'
          title="PHP 8.6 扩展已就绪（$ready），可以恢复变体"
          if [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title PHP 8.6 扩展已就绪" --json number --jq 'length')" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(cat <<EOF
          自动检查发现以下扩展已能在 PHP 8.6 上编译：\`$ready\`

          可以考虑把它们在 8.6 上重新启用：

          - 从 \`versions.sh\` 的变体列表里去掉 \`IN("8.2", "8.3", "8.4", "8.5")\` 条件
            （即 8.6+ 也生成 \`swoole\` / \`swow\` / \`thread\`）
          - 运行 \`./apply-templates.sh 8.6-rc\` 与 \`./update.sh 8.6-rc\` 重新生成
          - 本地构建验证后推送

          该 issue 由 \`.github/workflows/check-86-extensions.yml\` 自动创建。
          EOF
            )"
          else
            echo "已有未关闭的提醒 issue，跳过"
          fi
