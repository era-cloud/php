name: Security Scan

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  generate-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - id: tags
        run: |
          tags="$(jq -c '[.[].tag]' .image-metrics.json)"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
  scan:
    needs: generate-tags
    strategy:
      matrix:
        image: ${{ fromJson(needs.generate-tags.outputs.tags) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/era-cloud/php:${{ matrix.image }}
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          ignore-policy: rego-policy.rego
          exit-code: '0'
          format: sarif
          output: trivy.sarif
      - name: Fix Trivy SARIF levels
        run: |
          # trivy 0.73.0 emits HIGH findings at level "error" when a multi-value
          # --severity filter is applied; restore HIGH -> "warning" so code
          # scanning shows the correct severity
          jq '(.runs[].results[]? | select((.message.text // "") | contains("Severity: HIGH"))) |= (.level = "warning")' \
            trivy.sarif > trivy.fixed.sarif
          mv trivy.fixed.sarif trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
